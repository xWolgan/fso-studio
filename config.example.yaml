# Ustawienia Studia. start.sh / start.cmd kopiuje ten plik jako config.yaml przy pierwszym uruchomieniu.
# Klucze API i wybór modeli ustawiasz w przeglądarce: Studio → Ustawienia (http://127.0.0.1:8100/ustawienia).
# Tu są tylko rzeczy rzadko zmieniane.

nazwa_studia: "Studio"            # tytuł w nagłówku; może być też {pl: "...", en: "...", fr: "..."}

zasoby: ./zasoby                  # Twoje pliki: wyniki, wgrane pliki, notatki, rozmowy, ustawienia
baza: ./zasoby/studio.db          # baza zadań i wydatków (SQLite)

uzytkownik: ja                    # jeden użytkownik, bez logowania. Pusty ("") = logowanie po imieniu (praca w grupie)

searx_url: ""                     # opcjonalnie: SearXNG do wyszukiwania w sieci w rozmowach (np. http://127.0.0.1:8888)

# --- Opcjonalnie: generowanie na własnej karcie graficznej (ComfyUI) ----------------------------------------------
# Studio działa w pełni bez tego (modele w chmurze). Gdy masz ComfyUI, dopisz maszynę — Studio pokaże wtedy także
# modele lokalne z modele/*/*.yaml (pliki do pobrania: MODELE.md).
maszyny: []
#  - id: moj-pc
#    nazwa: Mój komputer
#    comfyui: http://127.0.0.1:8188
#    role: [obraz, muzyka, sfx, mowa]        # obszary, które ta maszyna obsługuje: obraz, wideo, muzyka, sfx, mowa
#    # modele: [z-image-turbo]               # opcjonalnie: tylko te modele na tej maszynie
modele_wylaczone: []                         # modele lokalne do ukrycia (id z modele/*/*.yaml), np. gdy nie masz ich wag
# llm_url: http://127.0.0.1:11434/v1         # opcjonalnie: lokalny LLM (np. Ollama) jako ostatni zapas dla rozmów
