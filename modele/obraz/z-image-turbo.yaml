id: z-image-turbo
nazwa: Z-Image Turbo
obszar: obraz
kolejnosc: 10
licencja: Apache 2.0
opis:
  pl: Bardzo szybki. Dobry do szukania kierunku i szkiców — kilka sekund na obraz.
  en: Very fast. Good for exploring directions and sketches — a few seconds per image.
  fr: "Très rapide. Idéal pour chercher une direction et faire des esquisses — quelques secondes par image."
backend: comfyui
workflow: obraz/zimage-turbo_tekst-na-obraz.api.json
wyjscie: obraz
parametry:
  - id: prompt
    typ: prompt
    cel: ["@57:27.text"]
  - id: proporcje
    typ: proporcje
    domyslnie: "16:9"
    opcje: ["16:9", "21:9", "3:2", "4:3", "1:1", "3:4", "2:3", "9:16"]
    megapiksele: 1.0
    wielokrotnosc: 16
    cel_szerokosc: ["@57:13.width"]
    cel_wysokosc: ["@57:13.height"]
  - id: seed
    typ: seed
    cel: ["@57:3.seed"]
  - id: kroki
    typ: liczba
    etykieta: {pl: kroki, en: steps, fr: étapes}
    min: 4
    max: 16
    domyslnie: 8
    zaawansowane: true
    cel: ["@57:3.steps"]
