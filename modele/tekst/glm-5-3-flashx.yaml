id: glm-5-3-flashx
nazwa: GLM 5.3 FlashX
obszar: tekst
kolejnosc: 40
licencja: "API — warunki dostawcy"
opis:
  pl: "GLM 5.3 FlashX (Z.ai) przez API (OpenRouter). Bardzo szybki, zawsze „myśli” przed odpowiedzią, rozumie obrazy; ok. 3–4× koszt Qwena. Rozmowa jest wysyłana do dostawcy (bez zbierania danych); gdy nie odpowiada — odpowiada Qwen 3.8 Flash."
  en: "GLM 5.3 FlashX (Z.ai) via API (OpenRouter). Very fast, always “thinks” before answering, understands images; about 3–4× Qwen's cost. The conversation is sent to the provider (no data collection); when it doesn't respond, Qwen 3.8 Flash answers."
  fr: "GLM 5.3 FlashX (Z.ai) via API (OpenRouter). Très rapide, « réfléchit » toujours avant de répondre, comprend les images ; environ 3–4× le coût de Qwen. La conversation est envoyée au fournisseur (sans collecte de données) ; s'il ne répond pas, c'est Qwen 3.8 Flash qui répond."
backend: llm
wyjscie: tekst
stale:
  api_model: z-ai/glm-5.3-flashx
  myslenie: zawsze          # dostawca nie pozwala wyłączyć myślenia
