  pl: "Mistral Large 4 (Mistral AI, Francja) przez API (OpenRouter). Duży model europejski, mocny w językach europejskich, rozumie obrazy; najdroższy z listy (ok. 4–5× koszt Qwena). Rozmowa jest wysyłana do dostawcy (bez zbierania danych); gdy nie odpowiada — odpowiada Qwen 3.8 Flash."
