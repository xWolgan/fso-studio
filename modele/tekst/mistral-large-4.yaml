  fr: "Mistral Large 4 (Mistral AI, France) via API (OpenRouter). Un grand modèle européen, solide dans les langues européennes, comprend les images ; le plus cher de la liste (environ 4–5× le coût de Qwen). La conversation est envoyée au fournisseur (sans collecte de données) ; s'il ne répond pas, c'est Qwen 3.8 Flash qui répond."
