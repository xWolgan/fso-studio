id: ltx-2-3-klatki
ukryty: true
nazwa: LTX 2.3 · pierwsza i ostatnia klatka
nazwy: {en: "LTX 2.3 · first and last frame", fr: "LTX 2.3 · première et dernière image"}
obszar: wideo
kolejnosc: 42
poradnik: ltx-2-3
licencja: LTX-2 Community
opis:
  pl: "Przejście między pierwszą a ostatnią klatką, z dźwiękiem."
  en: "A transition between a first and a last frame, with sound."
  fr: "Transition entre une première et une dernière image, avec son."
uwagi:
  pl: "Jeden przebieg od razu w pełnej rozdzielczości (bez upscalera). Dźwięk powstaje razem z obrazem — opisz go w prompcie. Długi, ciągły opis akcji działa lepiej niż lista słów."
  en: "A single pass at full resolution (no upscaler). Sound is generated together with the picture — describe it in the prompt. A long, continuous description of the action works better than a list of words."
  fr: "Une seule passe, directement en pleine résolution (sans upscaler). Le son est généré en même temps que l'image — décris-le dans le prompt. Une description longue et continue de l'action fonctionne mieux qu'une liste de mots."
backend: comfyui
workflow: wideo/ltx_23_pierwsza-i-ostatnia-klatka.api.json
wyjscie: wideo
wejscia:
  - id: klatka_start
    typ: obraz
    etykieta: {pl: pierwsza klatka, en: first frame, fr: première image}
    wymagane: true
    cel: ["@klatka_start.image"]
  - id: klatka_koniec
    typ: obraz
    etykieta: {pl: ostatnia klatka, en: last frame, fr: dernière image}
    wymagane: true
    cel: ["@klatka_koniec.image"]
parametry:
  - id: prompt
    typ: prompt
    cel: ["@prompt_enc.text"]
  - id: proporcje
    typ: proporcje
    domyslnie: "16:9"
    opcje: ["16:9", "21:9", "4:3", "1:1", "3:4", "9:16"]
    megapiksele: 0.88
    wielokrotnosc: 32
    cel_szerokosc: ["@szer.value"]
    cel_wysokosc: ["@wys.value"]
  - id: dlugosc
    typ: liczba
    etykieta: {pl: długość (s), en: length (s), fr: durée (s)}
    domyslnie: 10
    min: 1
    max: 20
    cel: ["@sekundy.value"]
  - id: fps
    typ: wybor
    etykieta: {pl: klatki na sekundę, en: frames per second, fr: images par seconde}
    domyslnie: 25
    opcje: [24, 25]
    cel: ["@fps.value"]

  - id: seed
    typ: seed
    cel: ["@szum.noise_seed"]
