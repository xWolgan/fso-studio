id: kling-3-omni
nazwa: Kling 3.0 Omni · API
obszar: wideo
kolejnosc: 31
licencja: {pl: "Kling (usługa komercyjna, przez HiggsField)", en: "Kling (commercial service, via HiggsField)", fr: "Kling (service commercial, via HiggsField)"}
opis:
  pl: "Kling 3.0 Omni (O3) przez API (HiggsField), 3–15 s. Wideo z obrazów-referencji (postacie, przedmioty, miejsca — do 7), z pierwszą (i ostatnią) klatką albo z samego tekstu. Każda generacja schodzi z Twojego budżetu."
  en: "Kling 3.0 Omni (O3) via API (HiggsField), 3–15 s. Video from reference images (characters, objects, places — up to 7), from a first (and last) frame, or from text alone. Every generation is paid from your budget."
  fr: "Kling 3.0 Omni (O3) via API (HiggsField), 3–15 s. Vidéo à partir d'images de référence (personnages, objets, lieux — jusqu'à 7), d'une première (et dernière) image, ou du texte seul. Chaque génération est décomptée de ton budget."
uwagi:
  pl: "Referencje przywołuj w prompcie znacznikami @Image1, @Image2… (np. „@Image1 siada przy stole z @Image2”). Do pracy z klipem wideo jako referencją jest osobny model „Kling 3.0 Omni · referencja wideo”. Dostawca moderuje treść — odrzucone zadanie nie kosztuje."
  en: "Refer to the references in the prompt with the tags @Image1, @Image2… (e.g. “@Image1 sits at a table with @Image2”). For a video clip as a reference there is a separate model, “Kling 3.0 Omni · video reference”. The provider moderates content — a rejected job costs nothing."
  fr: "Dans le prompt, désigne les références par les balises @Image1, @Image2… (par ex. « @Image1 s'assoit à une table avec @Image2 »). Pour utiliser un clip vidéo comme référence, il existe un modèle séparé, « Kling 3.0 Omni · référence vidéo ». Le fournisseur modère le contenu — une tâche refusée ne coûte rien."
backend: api
dostawca: higgsfield
wyjscie: wideo
endpointy:
  - {endpoint: kling-video/o3/image-reference, gdy_ktores: [obrazy], wejscia: [obrazy, klatka_start, klatka_koniec]}
  - {endpoint: kling-video/o3/first-last-frame, gdy: [klatka_start], wejscia: [klatka_start, klatka_koniec]}
  - {endpoint: kling-video/o3/image-reference, gdy: [], wejscia: []}
cena:                     # USD za sekundę wyniku — wycena HiggsField (/estimate) 15.10.2026, rabat 50% do ok. 21.10; potem 2×
  wg: [rozdzielczosc, dzwiek]
  usd_s: {"720p|z_dzwiekiem": 0.056, "720p|bez_dzwieku": 0.042, "1080p|z_dzwiekiem": 0.070, "1080p|bez_dzwieku": 0.056}
wejscia:
  - id: obrazy
    typ: obraz
    wiele: 7
    znacznik: "@Image{n}"
    cel: image_urls
    etykieta: {pl: referencje — obrazy (do 7), en: references — images (up to 7), fr: "références — images (jusqu'à 7)"}
  - id: klatka_start
    typ: obraz
    cel: first_frame_url
    etykieta: {pl: pierwsza klatka (opcjonalnie), en: first frame (optional), fr: première image (facultatif)}
  - id: klatka_koniec
    typ: obraz
    cel: last_frame_url
    wymaga: [klatka_start]
    etykieta: {pl: ostatnia klatka (opcjonalnie; razem z pierwszą), en: last frame (optional; with the first), fr: dernière image (facultatif ; avec la première)}
parametry:
  - id: prompt
    typ: prompt
    wymagane: true
    cel: [prompt]
  - id: proporcje
    typ: wybor
    etykieta: {pl: proporcje, en: aspect ratio, fr: format}
    domyslnie: "16:9"
    opcje: ["16:9", "9:16", "1:1"]
    cel: [aspect_ratio]
  - id: rozdzielczosc
    typ: tryb
    etykieta: {pl: rozdzielczość, en: resolution, fr: résolution}
    domyslnie: "720p"
    pomoc:
      pl: "720p — Standard; 1080p — Pro (droższy)."
      en: "720p — Standard; 1080p — Pro (more expensive)."
      fr: "720p — Standard ; 1080p — Pro (plus cher)."
    opcje_cele:
      "720p": {mode: std}
      "1080p": {mode: pro}
  - id: dlugosc
    typ: dlugosc
    etykieta: {pl: długość (s), en: length (s), fr: durée (s)}
    domyslnie: 5
    min: 3
    max: 15
    krok: 1
    int: true
    cel_sekundy: [duration]
  - id: dzwiek
    typ: tryb
    etykieta: {pl: dźwięk, en: sound, fr: son}
    domyslnie: z_dzwiekiem
    opcje_cele:
      z_dzwiekiem: {sound: "on"}
      bez_dzwieku: {sound: "off"}
