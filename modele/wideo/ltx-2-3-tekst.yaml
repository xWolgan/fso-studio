id: ltx-2-3-tekst
ukryty: true
nazwa: LTX 2.3 · tekst → wideo
nazwy: {en: "LTX 2.3 · text → video", fr: "LTX 2.3 · texte → vidéo"}
obszar: wideo
kolejnosc: 40
poradnik: ltx-2-3
licencja: LTX-2 Community
opis:
  pl: "Wideo z dźwiękiem z samego tekstu. Ok. 50 s na 5 s w 1280×704."
  en: "Video with sound from text alone. About 50 s for 5 s at 1280×704."
  fr: "Vidéo avec son à partir du seul texte. Env. 50 s pour 5 s en 1280×704."
uwagi:
  pl: "Dwa etapy (połowa rozdzielczości + upscaler ×2). Dźwięk powstaje razem z obrazem — opisz go w prompcie. Długi, ciągły opis akcji działa lepiej niż lista słów."
  en: "Two stages (half resolution + ×2 upscaler). Sound is generated together with the picture — describe it in the prompt. A long, continuous description of the action works better than a list of words."
  fr: "Deux étapes (demi-résolution + upscaler ×2). Le son est généré en même temps que l'image — décris-le dans le prompt. Une description longue et continue de l'action fonctionne mieux qu'une liste de mots."
backend: comfyui
workflow: wideo/ltx_23_tekst-na-wideo.api.json
wyjscie: wideo
wejscia: []
parametry:
  - id: prompt
    typ: prompt
    cel: ["@prompt_tekst.value"]
  - id: proporcje
    typ: proporcje
    domyslnie: "16:9"
    opcje: ["16:9", "21:9", "4:3", "1:1", "3:4", "9:16"]
    megapiksele: 0.88
    wielokrotnosc: 32
    cel_szerokosc: ["@szer.value"]
    cel_wysokosc: ["@wys.value"]
  - id: dlugosc
    typ: liczba
    etykieta: {pl: długość (s), en: length (s), fr: durée (s)}
    domyslnie: 10
    min: 1
    max: 20
    cel: ["@sekundy.value"]
  - id: fps
    typ: wybor
    etykieta: {pl: klatki na sekundę, en: frames per second, fr: images par seconde}
    domyslnie: 25
    opcje: [24, 25]
    cel: ["@fps.value"]
  - id: rozbudowa
    typ: przelacznik
    etykieta: {pl: model sam rozbudowuje prompt, en: model expands the prompt, fr: le modèle enrichit lui-même le prompt}
    pomoc:
      pl: "Wbudowany LLM (Gemma) przepisuje prompt na bardziej szczegółowy przed generowaniem. Domyślnie wyłączone."
      en: "A built-in LLM (Gemma) rewrites the prompt into a more detailed one before generation. Off by default."
      fr: "Un LLM intégré (Gemma) réécrit le prompt de façon plus détaillée avant la génération. Désactivé par défaut."
    domyslnie: false
    zaawansowane: true
    cel: ["@rozbudowa.value"]
  - id: seed
    typ: seed
    cel: ["@szum.noise_seed"]
